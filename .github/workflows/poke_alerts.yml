name: Poke Alerts Hourly Monitor

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      preview_mode:
        description: "Enviar 1 codigo y 1 evento TCGP de muestra sin alterar state.json"
        required: false
        type: boolean
        default: false
      weekly_meta:
        description: "Generar y enviar manualmente el Top 3 semanal (TCGP + Pokémon GO)"
        required: false
        type: boolean
        default: false
      weekly_codes:
        description: "Enviar manualmente el consolidado semanal de códigos activos"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poke-alerts-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref_name }}

      - name: Setup Python 3.11
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run poke-alerts pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          EXTRA_ARGS=""
          if [ "${{ inputs.preview_mode }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --preview-sample"
          fi
          if [ "${{ inputs.weekly_meta }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --weekly-meta"
          fi
          if [ "${{ inputs.weekly_codes }}" = "true" ]; then
            EXTRA_ARGS="$EXTRA_ARGS --weekly-codes"
          fi
          python -m src.main $EXTRA_ARGS

      - name: Commit updated state and dashboard catalog if changed
        run: |
          if ! git diff --quiet state.json data/events_history.json docs/events_data.js 2>/dev/null || [ -n "$(git status --porcelain state.json data/events_history.json docs/events_data.js)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json data/events_history.json docs/events_data.js
            if ! git diff --cached --quiet; then
              git commit -m "chore(state): update poke-alerts state and events catalog"
              git pull --rebase --autostash origin "${{ github.ref_name }}"
              git push origin HEAD:"${{ github.ref_name }}"
            fi
          fi
