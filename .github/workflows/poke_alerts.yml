name: Poke Alerts Hourly Monitor

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      preview_mode:
        description: "Enviar 1 codigo y 1 evento TCGP de muestra sin alterar state.json"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: poke-alerts-state
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          if [ ! -f /usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf ]; then
            sudo apt-get update && sudo apt-get install -y --no-install-recommends fonts-dejavu-core
          fi

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run poke-alerts pipeline
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          if [ "${{ inputs.preview_mode }}" = "true" ]; then
            python -m src.main --preview-sample
          else
            python -m src.main
          fi

      - name: Commit updated state.json if changed
        run: |
          if ! git diff --quiet state.json; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state.json
            git commit -m "chore(state): update poke-alerts seen state"
            git pull --rebase --autostash origin "${{ github.ref_name }}"
            git push origin HEAD:"${{ github.ref_name }}"
          fi
